[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-broker-provider"
version = "0.1.0"
description = "Python MCP tools over the libmcpb C99 provider transport"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcp_provider = ["*.dll", "*.so", "*.dylib"]
