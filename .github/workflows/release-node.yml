name: release-node

# Publishes @cyanmycelium/mcp-broker only, then lists it in the official MCP
# registry (job mcp-registry). The provider side of the tunnel
# lives in the same workspace but ships on its own `provider-v*` tag series,
# see release-provider.yml.
on:
    push:
        tags: ["node-v*"]

defaults:
    run:
        working-directory: node

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 20.x
                  registry-url: https://registry.npmjs.org
                  cache: "npm"
                  cache-dependency-path: node/package-lock.json

            # npm < 11.5.1 does not support OIDC trusted publishing, and Node 20.x
            # ships npm 10.x, so upgrade explicitly before publish. Pin to npm 11.x:
            # npm@latest is 12.x, which dropped Node 20 support (requires Node >=22.22),
            # while npm 11.x still runs on Node 20.17+ and already supports OIDC.
            - name: Upgrade npm to enable OIDC trusted publishing
              run: |
                  npm install -g npm@^11
                  echo "npm version after upgrade: $(npm --version)"

            - run: npm ci
            - run: npm run lint
            - run: npm run build
            # Type-checks the test files too, which `build` skips.
            - run: npm run typecheck
            - run: npm test

            # `npm ci` above installs the whole workspace, so target the package
            # explicitly rather than publishing whatever sits in the cwd.
            - run: npm publish --workspace @cyanmycelium/mcp-broker --access public --provenance

            - name: Dump npm debug log on failure
              if: failure()
              run: |
                  echo "=== Environment ==="
                  echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+<set>}"
                  echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+<set>}"
                  echo "=== npm version ==="
                  npm --version
                  echo "=== npm config ==="
                  npm config list
                  echo "=== npm debug logs ==="
                  for f in /home/runner/.npm/_logs/*.log; do
                    echo "----- $f -----"
                    cat "$f"
                  done

            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true

    # Lists the release in the official MCP registry as
    # io.github.pandaGaume/mcp-broker, from node/packages/broker/server.json.
    # A job of its own so that a registry failure leaves npm and the GitHub
    # release intact and can be re-run alone. The registry verifies ownership
    # by reading `mcpName` in the published package.json, so it must run after
    # npm publish, and it may need a moment before the new version is visible.
    mcp-registry:
        needs: publish
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # GitHub OIDC grants the io.github.pandaGaume/* namespace
        env:
            MCP_PUBLISHER_VERSION: v1.8.9
        defaults:
            run:
                working-directory: node/packages/broker
        steps:
            - uses: actions/checkout@v5

            - name: Check server.json against the tag
              run: |
                  set -euo pipefail
                  tag_version="${GITHUB_REF_NAME#node-v}"
                  for field in .version '.packages[0].version'; do
                      value="$(jq -r "$field" server.json)"
                      if [ "$value" != "$tag_version" ]; then
                          echo "::error::server.json $field is $value, the tag is $GITHUB_REF_NAME"
                          exit 1
                      fi
                  done
                  test "$(jq -r .name server.json)" = "$(jq -r .mcpName package.json)"

            - name: Install cosign
              uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

            - name: Download and verify mcp-publisher
              run: |
                  set -euo pipefail
                  os="$(uname -s | tr '[:upper:]' '[:lower:]')"
                  arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
                  archive="mcp-publisher_${os}_${arch}.tar.gz"
                  base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
                  curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
                  curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
                  cosign verify-blob \
                      --bundle "$archive.sigstore.json" \
                      --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
                      --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
                      "$archive"
                  tar xzf "$archive" mcp-publisher
                  rm -f "$archive" "$archive.sigstore.json"

            # The registry checks the version against npm, and npm can take
            # several minutes to serve a version it has just accepted (1.14.0
            # and 1.15.0 both outlasted the 2.5 minutes of retries below). Wait
            # for npm itself, before logging in, so the OIDC token is fresh.
            - name: Wait until npm serves the version
              timeout-minutes: 20
              run: |
                  set -euo pipefail
                  package="$(jq -r .name package.json)"
                  version="${GITHUB_REF_NAME#node-v}"
                  for attempt in $(seq 1 60); do
                      if [ "$(npm view "$package@$version" version 2>/dev/null)" = "$version" ]; then
                          echo "npm serves $package@$version (check $attempt)"
                          exit 0
                      fi
                      echo "npm does not serve $package@$version yet (check $attempt of 60), next check in 15 s"
                      sleep 15
                  done
                  echo "::error::npm still does not serve $package@$version after 15 minutes; re-run this job once it does"
                  exit 1

            - name: Authenticate to the MCP registry
              run: ./mcp-publisher login github-oidc

            - name: Publish to the MCP registry
              run: |
                  for attempt in 1 2 3 4 5; do
                      if ./mcp-publisher publish; then exit 0; fi
                      echo "publish attempt $attempt failed, retrying in 30 s"
                      sleep 30
                  done
                  exit 1
