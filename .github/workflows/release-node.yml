name: release-node

# Publishes @cyanmycelium/mcp-broker only. The provider side of the tunnel
# lives in the same workspace but ships on its own `provider-v*` tag series,
# see release-provider.yml.
on:
    push:
        tags: ["node-v*"]

env:
    # Opt into Node 24 for JavaScript-based actions (checkout, setup-node, ...)
    # to silence the September 2026 deprecation warning for Node 20.
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
    run:
        working-directory: node

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20.x
                  registry-url: https://registry.npmjs.org
                  cache: "npm"
                  cache-dependency-path: node/package-lock.json

            # npm < 11.5.1 does not support OIDC trusted publishing, and Node 20.x
            # ships npm 10.x, so upgrade explicitly before publish. Pin to npm 11.x:
            # npm@latest is 12.x, which dropped Node 20 support (requires Node >=22.22),
            # while npm 11.x still runs on Node 20.17+ and already supports OIDC.
            - name: Upgrade npm to enable OIDC trusted publishing
              run: |
                  npm install -g npm@^11
                  echo "npm version after upgrade: $(npm --version)"

            - run: npm ci
            - run: npm run lint
            - run: npm run build
            # Type-checks the test files too, which `build` skips.
            - run: npm run typecheck
            - run: npm test

            # `npm ci` above installs the whole workspace, so target the package
            # explicitly rather than publishing whatever sits in the cwd.
            - run: npm publish --workspace @cyanmycelium/mcp-broker --access public --provenance

            - name: Dump npm debug log on failure
              if: failure()
              run: |
                  echo "=== Environment ==="
                  echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:+<set>}"
                  echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+<set>}"
                  echo "=== npm version ==="
                  npm --version
                  echo "=== npm config ==="
                  npm config list
                  echo "=== npm debug logs ==="
                  for f in /home/runner/.npm/_logs/*.log; do
                    echo "----- $f -----"
                    cat "$f"
                  done

            - uses: softprops/action-gh-release@v2
              with:
                  generate_release_notes: true
