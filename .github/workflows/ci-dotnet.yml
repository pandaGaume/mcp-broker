name: ci-dotnet

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - "dotnet/**"
            - ".github/workflows/ci-dotnet.yml"
            - "node/packages/broker/src/**"
            - "node/packages/broker/package.json"
            - "node/packages/broker/tsup.config.ts"
            - "node/packages/provider/src/**"
            - "node/packages/provider/package.json"
            - "node/packages/provider/tsup.config.ts"
            - "node/package.json"
            - "node/package-lock.json"
            - "samples/lib/mcp-http-client.mjs"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

defaults:
    run:
        working-directory: dotnet

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: "8.0.x"
            - run: dotnet restore --configfile NuGet.Config
            - run: dotnet build --configuration Release --no-restore
            - name: Verify provider package
              run: dotnet pack src/CyanMycelium.Mcp.Broker.Provider --configuration Release --no-build --no-restore --output artifacts
            - uses: actions/setup-node@v5
              with:
                  node-version: 20.x
                  cache: npm
                  cache-dependency-path: node/package-lock.json
            - run: npm ci
              working-directory: node
            - run: npm run build
              working-directory: node
            - name: Exercise C# transports against the Node broker
              run: node dotnet/tests/run.mjs
              working-directory: .
