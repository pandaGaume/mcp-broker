name: ci-c

on:
    push:
        branches: [main]
        paths:
            - "c/**"
            - ".github/workflows/ci-c.yml"
            # The roundtrip drives the Node broker: a change there must keep
            # the C client passing too.
            - "node/packages/broker/**"
    pull_request:
        branches: [main]
        paths:
            - "c/**"
            - ".github/workflows/ci-c.yml"
            - "node/packages/broker/**"

jobs:
    build:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                cc: [gcc, clang]
        env:
            CC: ${{ matrix.cc }}
        defaults:
            run:
                working-directory: c
        steps:
            - uses: actions/checkout@v5
            # The TLS port is required here, not auto-detected: a runner
            # without OpenSSL must fail the configure, not skip the port.
            - run: sudo apt-get install -y --no-install-recommends libssl-dev
            # Warnings are errors here and nowhere else: the library is
            # developed warning-free under -Wconversion, and a narrowing that
            # slips in is how a frame length gets truncated.
            - run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror -DMCPB_TLS=ON
            - run: cmake --build build
            - run: ctest --test-dir build --output-on-failure

    # The Makefile is the path for toolchains without CMake, so it has to
    # keep working too, in both configurations: without the multiplexed
    # endpoint (a one-provider firmware) and with it.
    make:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: make -C c/libmcpb test
            - run: make -C c/libmcpb clean && make -C c/libmcpb MUX=1 test

    # The only test that crosses a real network: the C provider against the
    # Node broker of this repository, through its own slot and through _all,
    # then a broker kill and restart, then the same over wss://.
    roundtrip:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 20.x
                  cache: "npm"
                  cache-dependency-path: node/package-lock.json
            - run: npm ci
              working-directory: node
            - run: npm run build
              working-directory: node
            - run: sudo apt-get install -y --no-install-recommends libssl-dev
            - run: cmake -S c -B c/build -DCMAKE_C_FLAGS=-Werror -DMCPB_TLS=ON
            - run: cmake --build c/build
            # The wss:// phase must run, not be skipped for a binary without
            # the TLS port.
            - run: node c/tests/roundtrip/run.mjs
              env:
                  MCPB_ROUNDTRIP_REQUIRE_TLS: "1"

    # The ESP-IDF component and its sample, built for the S3 in the official
    # IDF image. No hardware: this proves the component compiles against the
    # IDF it targets, and that libmcpb still passes its own warning set on
    # Xtensa. Running it is the user's board's job.
    espressif:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: espressif/esp-idf-ci-action@v1
              with:
                  esp_idf_version: v6.0
                  target: esp32s3
                  path: c/espressif/samples/provider
