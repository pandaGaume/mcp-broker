name: ci-c

on:
    workflow_dispatch:
    pull_request:
        branches: [main]
        paths:
            - "c/**"
            - ".github/workflows/ci-c.yml"
            - "node/packages/broker/src/**"
            - "node/packages/broker/package.json"
            - "node/packages/broker/tsup.config.ts"
            - "node/packages/broker/scripts/**"
            - "node/packages/provider/src/**"
            - "node/packages/provider/package.json"
            - "node/packages/provider/tsup.config.ts"
            - "node/package.json"
            - "node/package-lock.json"
            - "samples/lib/mcp-http-client.mjs"

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

jobs:
    changes:
        runs-on: ubuntu-latest
        outputs:
            native: ${{ steps.filter.outputs.native }}
            make: ${{ steps.filter.outputs.make }}
            roundtrip: ${{ steps.filter.outputs.roundtrip }}
            espressif: ${{ steps.filter.outputs.espressif }}
        steps:
            - uses: actions/checkout@v5
              with:
                  fetch-depth: 0
            - name: Select affected checks
              id: filter
              env:
                  BASE_SHA: ${{ github.event.pull_request.base.sha }}
              run: |
                  native=false
                  make=false
                  roundtrip=false
                  espressif=false
                  if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
                    native=true; make=true; roundtrip=true; espressif=true
                  else
                    git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/ci-c-paths"
                    while IFS= read -r file; do
                      case "$file" in
                        .github/workflows/ci-c.yml)
                          native=true; make=true; roundtrip=true; espressif=true ;;
                        c/libmcpb/*)
                          native=true; make=true; roundtrip=true; espressif=true ;;
                        c/CMakeLists.txt|c/ports/host/*|c/ports/tls-openssl/*|c/samples/host-provider/*|c/tests/*)
                          native=true; roundtrip=true ;;
                        c/espressif/*|c/ports/espressif/*)
                          espressif=true ;;
                        node/*|samples/lib/mcp-http-client.mjs)
                          roundtrip=true ;;
                      esac
                    done < "$RUNNER_TEMP/ci-c-paths"
                  fi
                  printf 'native=%s\nmake=%s\nroundtrip=%s\nespressif=%s\n' \
                    "$native" "$make" "$roundtrip" "$espressif" >> "$GITHUB_OUTPUT"

    build:
        needs: changes
        if: needs.changes.outputs.native == 'true'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                cc: [gcc, clang]
        env:
            CC: ${{ matrix.cc }}
        defaults:
            run:
                working-directory: c
        steps:
            - uses: actions/checkout@v5
            # The TLS port is required here, not auto-detected: a runner
            # without OpenSSL must fail the configure, not skip the port.
            - run: sudo apt-get install -y --no-install-recommends libssl-dev
            # Warnings are errors here and nowhere else: the library is
            # developed warning-free under -Wconversion, and a narrowing that
            # slips in is how a frame length gets truncated.
            - run: cmake -S . -B build -DCMAKE_C_FLAGS=-Werror -DMCPB_TLS=ON
            - run: cmake --build build
            - run: ctest --test-dir build --output-on-failure

    # The Makefile is the path for toolchains without CMake, so it has to
    # keep working too, in both configurations: without the multiplexed
    # endpoint (a one-provider firmware) and with it.
    make:
        needs: changes
        if: needs.changes.outputs.make == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - run: make -C c/libmcpb test
            - run: make -C c/libmcpb clean && make -C c/libmcpb MUX=1 test

    # The only test that crosses a real network: the C provider against the
    # Node broker of this repository, through its own slot and through _all,
    # then a broker kill and restart, then the same over wss://.
    roundtrip:
        needs: changes
        if: needs.changes.outputs.roundtrip == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/setup-node@v5
              with:
                  node-version: 20.x
                  cache: "npm"
                  cache-dependency-path: node/package-lock.json
            - run: npm ci
              working-directory: node
            - run: npm run build
              working-directory: node
            - run: sudo apt-get install -y --no-install-recommends libssl-dev
            - run: cmake -S c -B c/build -DCMAKE_C_FLAGS=-Werror -DMCPB_TLS=ON
            - run: cmake --build c/build
            # The wss:// phase must run, not be skipped for a binary without
            # the TLS port.
            - run: node c/tests/roundtrip/run.mjs
              env:
                  MCPB_ROUNDTRIP_REQUIRE_TLS: "1"

    # The ESP-IDF component and its sample, built for the S3 in the official
    # IDF image. No hardware: this proves the component compiles against the
    # IDF it targets, and that libmcpb still passes its own warning set on
    # Xtensa. Running it is the user's board's job.
    espressif:
        needs: changes
        if: needs.changes.outputs.espressif == 'true'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: espressif/esp-idf-ci-action@v1
              with:
                  esp_idf_version: v6.0
                  target: esp32s3
                  path: c/espressif/samples/provider
