name: pages

on:
    push:
        branches: [main]
        paths:
            - "docs/**"
            - ".github/workflows/pages.yml"
    workflow_dispatch:

permissions:
    contents: read
    pages: read

concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: actions/configure-pages@v5
            # Preserve the existing branch-based site's Markdown rendering.
            - uses: actions/jekyll-build-pages@v1
              with:
                  source: docs
                  destination: _site
            - uses: actions/upload-pages-artifact@v4
              with:
                  path: _site

    deploy:
        needs: build
        if: github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - uses: actions/deploy-pages@v4
              id: deployment
