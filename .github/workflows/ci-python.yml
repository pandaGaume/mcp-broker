name: CI (Python)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "c/libmcpb/**"
      - "c/ports/host/**"
      - "c/ports/tls-openssl/**"
      - "c/tests/tls/**"
      - "node/**"
      - "samples/lib/mcp-http-client.mjs"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

jobs:
  native-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: python/src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Locate the runner's OpenSSL SDK on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $opensslRoot = Join-Path $env:ProgramFiles 'OpenSSL'
          if (-not (Test-Path -LiteralPath (Join-Path $opensslRoot 'include/openssl/ssl.h'))) {
            throw "The runner's OpenSSL development SDK is missing from $opensslRoot"
          }
          "OPENSSL_ROOT_DIR=$opensslRoot" >> $env:GITHUB_ENV
          & (Join-Path $opensslRoot 'bin/openssl.exe') version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure native library on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: cmake -S python -B python/build "-DOPENSSL_ROOT_DIR=$env:OPENSSL_ROOT_DIR" -DOPENSSL_USE_STATIC_LIBS=OFF
      - name: Configure native library on macOS
        if: runner.os == 'macOS'
        run: cmake -S python -B python/build -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)"
      - name: Configure native library on Linux
        if: runner.os == 'Linux'
        run: cmake -S python -B python/build
      - run: cmake --build python/build --config Release
      - run: python -m unittest discover -s python/tests -v
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: node python/tests/roundtrip.mjs
      - run: node python/tests/features.mjs
      - run: node python/examples/complete.mjs
      - run: node python/examples/complete.mjs --tls
