name: CI (Python)

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - "c/libmcpb/**"
      - "c/ports/host/**"
      - "node/**"
      - "samples/lib/mcp-http-client.mjs"
      - ".github/workflows/ci-python.yml"

permissions:
  contents: read

jobs:
  native-python:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: python/src
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: cmake -S python -B python/build
      - run: cmake --build python/build --config Release
      - run: python -m unittest discover -s python/tests -v
      - run: npm ci
        working-directory: node
      - run: npm run build
        working-directory: node
      - run: node python/tests/roundtrip.mjs
      - run: node python/examples/complete.mjs
